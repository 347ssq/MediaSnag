name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Python standalone
        shell: bash
        run: |
          mkdir -p staging
          curl -L -o python.tar.gz "https://github.com/astral-sh/python-build-standalone/releases/download/20240415/cpython-3.12.3%2B20240415-x86_64-pc-windows-msvc-install_only.tar.gz"
          tar -xzf python.tar.gz -C staging/
          mv staging/python staging/python_temp
          mkdir -p staging/python
          mv staging/python_temp/* staging/python/
          rmdir staging/python_temp
          rm python.tar.gz

      - name: Download yt-dlp
        shell: bash
        run: |
          mkdir -p staging/bin
          curl -L -o staging/bin/yt-dlp.exe "https://github.com/yt-dlp/yt-dlp/releases/download/2024.08.06/yt-dlp.exe"

      - name: Download ffmpeg
        shell: bash
        run: |
          curl -L -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          7z x ffmpeg.zip -offmpeg-temp
          cp ffmpeg-temp/ffmpeg-*/bin/ffmpeg.exe staging/bin/ffmpeg.exe
          cp ffmpeg-temp/ffmpeg-*/bin/ffprobe.exe staging/bin/ffprobe.exe
          rm -rf ffmpeg-temp ffmpeg.zip

      - name: Assemble app files
        shell: bash
        run: |
          mkdir -p staging/app
          cp -r app/* staging/app/
          cp app/templates/universal_downloader.user.js staging/userscript.user.js

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build installer
        shell: bash
        working-directory: video-downloader
        run: |
          mkdir -p build/staging
          cp -r staging/python build/staging/python
          cp -r staging/bin build/staging/bin
          cp -r staging/app build/staging/app
          cp staging/userscript.user.js build/staging/userscript.user.js
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" build/mediasnag.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MediaSnag-Setup
          path: video-downloader/build/installer/windows/output/MediaSnag-Setup.exe

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: MediaSnag-Setup

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: MediaSnag-Setup.exe
