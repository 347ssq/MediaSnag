name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Python standalone
        shell: bash
        run: |
          mkdir -p staging
          curl -L -o python.tar.gz "https://github.com/astral-sh/python-build-standalone/releases/download/20240415/cpython-3.12.3%2B20240415-x86_64-pc-windows-msvc-install_only.tar.gz"
          tar -xzf python.tar.gz -C staging/
          mv staging/python staging/python_temp
          mkdir -p staging/python
          mv staging/python_temp/* staging/python/
          rmdir staging/python_temp
          rm python.tar.gz

      - name: Download yt-dlp
        shell: bash
        run: |
          mkdir -p staging/bin
          curl -L -o staging/bin/yt-dlp.exe "https://github.com/yt-dlp/yt-dlp/releases/download/2024.08.06/yt-dlp.exe"

      - name: Download ffmpeg
        shell: bash
        run: |
          curl -L -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          7z x ffmpeg.zip -offmpeg-temp
          cp ffmpeg-temp/ffmpeg-*/bin/ffmpeg.exe staging/bin/ffmpeg.exe
          cp ffmpeg-temp/ffmpeg-*/bin/ffprobe.exe staging/bin/ffprobe.exe
          rm -rf ffmpeg-temp ffmpeg.zip

      - name: Assemble app files
        shell: bash
        run: |
          mkdir -p staging/app
          cp -r video-downloader/app/* staging/app/
          cp video-downloader/app/templates/universal_downloader.user.js staging/userscript.user.js

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          # Copy staging files
          New-Item -ItemType Directory -Force -Path "video-downloader/build/staging" | Out-Null
          Copy-Item -Recurse -Force "staging/python" "video-downloader/build/staging/python"
          Copy-Item -Recurse -Force "staging/bin" "video-downloader/build/staging/bin"
          Copy-Item -Recurse -Force "staging/app" "video-downloader/build/staging/app"
          Copy-Item -Force "staging/userscript.user.js" "video-downloader/build/staging/userscript.user.js"
          
          # Create output directory
          New-Item -ItemType Directory -Force -Path "video-downloader/build/installer/windows/output" | Out-Null
          
          # Find ISCC.exe
          $isccPaths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Error "ISCC.exe not found"
            exit 1
          }
          Write-Host "Using ISCC: $iscc"
          
          # Build
          & $iscc "video-downloader/build/mediasnag.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MediaSnag-Setup
          path: video-downloader/build/installer/windows/output/MediaSnag-Setup.exe

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: MediaSnag-Setup

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: MediaSnag-Setup.exe
